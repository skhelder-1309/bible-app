<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>황우님의 지혜의 서재</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        /* 짙고 포근한 묵직한 배경 컬러 (다크 우드 & 오트밀 베이스) */
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #24201D;
            color: #EDE6DF;
        }

        .serif-title {
            font-family: 'Georgia', 'Apple SD Gothic Neo', serif;
        }

        /* 묵직하고 고급스러운 그림자 및 카드 */
        .luxury-shadow {
            box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.4), 0 4px 12px -2px rgba(0, 0, 0, 0.2);
        }

        .luxury-card {
            background: #2D2723;
            border: 1px solid rgba(74, 63, 56, 0.8);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col select-none">

    <!-- 상단 짙은 럭셔리 네비게이션 앱바 -->
    <header
        class="bg-[#24201D]/95 backdrop-blur-md sticky top-0 z-30 border-b border-[#3E352E] px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div
                class="w-9 h-9 rounded-full bg-[#E5C158] text-[#24201D] flex items-center justify-center text-sm font-bold shadow-md">
                황</div>
            <div>
                <h1 class="font-bold text-sm tracking-tight text-[#F7F2EC]">황우님의 서재</h1>
                <p class="text-[10px] text-[#A6998A]">깊은 지혜와 영혼의 안식처</p>
            </div>
        </div>
        <div class="flex space-x-1 bg-[#1A1715] p-1 rounded-2xl border border-[#3E352E]">
            <button onclick="switchMainTab('bible')" id="nav-tab-bible"
                class="bg-[#E5C158] text-[#24201D] px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow-sm">성경
                주석</button>
            <button onclick="switchMainTab('topics')" id="nav-tab-topics"
                class="text-[#A6998A] hover:text-[#F7F2EC] px-3.5 py-1.5 rounded-xl text-xs font-semibold transition">상황별
                위로</button>
        </div>
    </header>

    <!-- 환영 및 힘을 주는 배너 -->
    <section class="px-6 pt-6 pb-2 max-w-md w-full mx-auto">
        <div
            class="luxury-card rounded-3xl p-6 luxury-shadow relative overflow-hidden bg-gradient-to-br from-[#2D2723] via-[#24201D] to-[#1C1816]">
            <!-- 빛나는 골드 포인트 효과 -->
            <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-[#E5C158]/10 rounded-full blur-2xl"></div>
            <div class="relative z-10 space-y-3">
                <div
                    class="inline-flex items-center space-x-1.5 bg-[#3B322A] text-[#E5C158] px-3.5 py-1 rounded-full text-[11px] font-bold border border-[#52453B]">
                    <span>✨ 오늘의 영적 충전</span>
                </div>
                <p class="serif-title text-[#F7F2EC] text-base leading-relaxed font-medium">
                    "지친 마음을 내려놓고, 온전한 평안 안에서 다시 일어설 힘을 얻으세요."
                </p>
                <div class="flex items-center justify-between pt-2 border-t border-[#3E352E] text-xs text-[#A6998A]">
                    <span>🌿 오늘의 동행 말씀 대기 중</span>
                    <span class="font-semibold text-[#E5C158]">Lv.3 깊은 묵상</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 난이도 선택 및 책 이동 바 -->
    <div id="level-bar" class="px-6 py-3 sticky top-[73px] z-20 bg-[#24201D]/95 backdrop-blur">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2">
            <div class="grid grid-cols-3 gap-1 bg-[#1A1715] p-1 rounded-2xl border border-[#3E352E] flex-1">
                <button onclick="changeLevel(1)" id="btn-1"
                    class="py-1.5 text-xs font-bold rounded-xl bg-[#E5C158] text-[#24201D] transition shadow-sm">초신자용</button>
                <button onclick="changeLevel(2)" id="btn-2"
                    class="py-1.5 text-xs font-bold rounded-xl text-[#A6998A] hover:text-[#F7F2EC] transition">일반
                    성도</button>
                <button onclick="changeLevel(3)" id="btn-3"
                    class="py-1.5 text-xs font-bold rounded-xl text-[#A6998A] hover:text-[#F7F2EC] transition">리더·교사</button>
            </div>
            <button onclick="openBookModal()"
                class="luxury-card hover:bg-[#38302A] active:scale-95 transition px-4 py-2.5 rounded-2xl text-xs font-bold text-[#F7F2EC] flex items-center space-x-1.5 shrink-0 shadow-sm border border-[#3E352E]">
                <span id="current-location-btn">요한복음 3장</span>
                <svg class="w-3.5 h-3.5 text-[#E5C158]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- 성경 본문 뷰 -->
    <main id="view-bible" class="flex-1 max-w-md w-full mx-auto px-6 py-2 space-y-4 pb-32">
        <div class="luxury-card rounded-3xl p-6 luxury-shadow space-y-4">
            <p
                class="text-xs text-[#E5C158] font-bold flex items-center bg-[#3B322A] px-3.5 py-2.5 rounded-xl border border-[#52453B]">
                <span class="mr-1.5">💡</span> 구절을 터치하시면 깊이 있는 주석과 삶의 적용이 펼쳐집니다.
            </p>
            <div id="verses-list" class="space-y-3 font-serif leading-loose text-[#EDE6DF] text-base pt-2"></div>
        </div>
    </main>

    <!-- 상황별 위로 뷰 -->
    <main id="view-topics" class="flex-1 max-w-md w-full mx-auto px-6 py-2 space-y-4 pb-32 hidden">
        <div class="luxury-card rounded-3xl p-6 luxury-shadow space-y-4">
            <div>
                <h2 class="text-base font-bold text-[#F7F2EC] flex items-center serif-title"><span
                        class="mr-2">🧭</span> 인생 상황별 맞춤 묵상</h2>
                <p class="text-xs text-[#A6998A] mt-1">지금 마주한 상황을 선택하시면 위로와 새 힘을 얻는 구절을 안내해 드립니다.</p>
            </div>
            <div id="topic-tags-container" class="flex flex-wrap gap-2 pt-2"></div>
        </div>
        <div id="topic-result-card" class="luxury-card rounded-3xl p-6 space-y-4 luxury-shadow hidden bg-[#2D2723]">
            <div class="flex justify-between items-center border-b border-[#3E352E] pb-3">
                <span id="topic-result-title"
                    class="text-xs font-bold text-[#E5C158] tracking-wider uppercase">주제</span>
                <button onclick="closeTopicResult()"
                    class="text-[#A6998A] hover:text-[#F7F2EC] text-xs font-bold px-3 py-1 bg-[#1A1715] border border-[#3E352E] rounded-xl">닫기
                    ✕</button>
            </div>
            <p id="topic-result-verse"
                class="text-sm text-[#EDE6DF] italic font-serif leading-relaxed bg-[#1A1715] p-4 rounded-2xl border border-[#3E352E]">
            </p>
            <div class="bg-[#24201D] border border-[#3E352E] p-4 rounded-2xl space-y-2">
                <span id="topic-result-level-label"
                    class="text-[11px] font-bold text-[#E5C158] uppercase tracking-wider block">주석</span>
                <p id="topic-result-commentary" class="text-[#EDE6DF] text-sm leading-relaxed font-sans"></p>
            </div>
            <div class="bg-[#3B322A]/50 border border-[#52453B] p-4 rounded-2xl space-y-2">
                <span class="text-[11px] font-bold text-[#81C784] uppercase tracking-wider block flex items-center">
                    <span class="mr-1.5">🌱</span> 삶의 구체적 적용
                </span>
                <p id="topic-result-application" class="text-[#EDE6DF] text-sm leading-relaxed font-sans"></p>
            </div>
        </div>
    </main>

    <!-- 하단 주석 슬라이드 패널 -->
    <div id="commentary-panel"
        class="fixed bottom-0 left-0 right-0 bg-[#2D2723] border-t border-[#3E352E] p-6 z-40 transform translate-y-full transition-transform duration-300 shadow-2xl max-h-[80vh] overflow-y-auto rounded-t-[32px]">
        <div class="max-w-md mx-auto space-y-4">
            <div class="flex justify-between items-center border-b border-[#3E352E] pb-3">
                <span id="panel-title" class="text-sm font-bold text-[#E5C158]">주석 내용</span>
                <button onclick="closePanel()"
                    class="text-[#A6998A] hover:text-[#F7F2EC] text-xs font-bold px-3 py-1.5 bg-[#1A1715] border border-[#3E352E] rounded-xl">닫기
                    ✕</button>
            </div>
            <p id="panel-verse-text"
                class="text-sm text-[#EDE6DF] italic font-serif leading-relaxed bg-[#1A1715] p-4 rounded-2xl border border-[#3E352E]">
            </p>
            <div class="bg-[#24201D] border border-[#3E352E] p-4 rounded-2xl space-y-2">
                <span id="panel-level-label"
                    class="text-[11px] font-bold text-[#E5C158] uppercase tracking-wider block">주석</span>
                <p id="panel-commentary-text" class="text-[#EDE6DF] text-sm leading-relaxed font-sans"></p>
            </div>
            <div class="bg-[#3B322A]/50 border border-[#52453B] p-4 rounded-2xl space-y-2">
                <span class="text-[11px] font-bold text-[#81C784] uppercase tracking-wider block flex items-center">
                    <span class="mr-1.5">🌱</span> 삶의 구체적 적용
                </span>
                <p id="panel-application-text" class="text-[#EDE6DF] text-sm leading-relaxed font-sans"></p>
            </div>
        </div>
    </div>

    <!-- 성경 권 선택 모달 -->
    <div id="book-modal"
        class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex flex-col transition-opacity">
        <div class="px-6 py-5 border-b border-[#3E352E] flex justify-between items-center bg-[#24201D]">
            <h3 class="font-bold text-base text-[#F7F2EC] serif-title flex items-center"><span class="mr-2">📚</span> 성경
                권 선택</h3>
            <button onclick="closeBookModal()"
                class="text-[#A6998A] hover:text-[#F7F2EC] text-xs font-bold bg-[#38302A] px-4 py-2 rounded-xl border border-[#52453B]">닫기</button>
        </div>
        <div class="flex border-b border-[#3E352E] bg-[#24201D]/90 px-6 pt-3">
            <button onclick="switchTestament('ot')" id="tab-ot"
                class="flex-1 pb-3 text-xs font-bold text-[#A6998A] border-b-2 border-transparent transition">구약
                (39권)</button>
            <button onclick="switchTestament('nt')" id="tab-nt"
                class="flex-1 pb-3 text-xs font-bold text-[#E5C158] border-b-2 border-[#E5C158] transition">신약
                (27권)</button>
        </div>
        <div id="book-grid-container" class="flex-1 overflow-y-auto p-6 space-y-4 bg-[#24201D]"></div>
    </div>

    <footer
        class="bg-[#24201D] border-t border-[#3E352E] py-4 text-center text-xs text-[#A6998A] fixed bottom-0 left-0 right-0 z-20">
        황우님의 럭셔리 묵상 서재 • 정통 보수주의 주석 시스템
    </footer>

    <script>
        let currentLevel = 1;
        let activeVerseIndex = null;
        let currentTestament = 'nt';
        let currentBook = 'jhn';
        let currentChapter = 3;

        // 샘플 성경 데이터베이스 (주요 장 데이터 즉시 로드)
        const mockBibleDatabase = {
            "jhn_3": {
                book: "요한복음", chapter: 3,
                verses: [
                    { verse: 1, text: "그런데 바리새인 중에 니고데모라 하는 사람이 있으니 유대인의 지도자라", commentary: { level1: "니고데모는 당시 종교적 지위가 높았지만 영적인 갈증을 느꼈습니다.", level2: "바리새인으로서 율법에 완벽했지만 내면의 참된 진리를 찾아 예수님께 나아왔습니다.", level3: "율법주의의 한계를 직시하고 은혜의 진리로 향하는 대표적 인물상입니다." }, application: { level1: "내 안에 채워지지 않는 영적 갈증이 있다면 주님께 나아가세요.", level2: "세상의 지위와 상관없이 겸손히 주님을 찾는 태도가 필요합니다.", level3: "공동체 내에서 갈급함을 느끼는 영혼들을 세심하게 인도해야 합니다." } },
                    { verse: 2, text: "그가 밤에 예수께 와서 이르되 라비여 우 sozial 당신은 하나님께로부터 오신 선생님인 줄 아나이다 하나님이 함께 하시지 아니하시면 당신이 행하시는 이 표적을 아무도 칠 수 없나이다 하니", commentary: { level1: "사람들의 눈을 피해 밤에 찾아왔지만, 예수님을 향한 진정한 존경이 담겨 있습니다.", level2: "표적을 통해 예수님의 신성을 알아보았으나 아직 거듭남의 비밀은 깨닫지 못한 상태입니다.", level3: "니고데모의 지적 탐구와 영적 무지의 교차가 드러나는 대목입니다." }, application: { level1: "때로는 남모르는 고민과 밤을 지새우는 시간에 주님을 찾으십시오.", level2: "눈에 보이는 현상(표적)을 넘어 그 배후의 하나님의 섭리를 보아야 합니다.", level3: "어둠 속에 있는 구도자들을 정죄하지 않고 따뜻하게 품어주어야 합니다." } },
                    { verse: 3, text: "예수께서 대답하여 이르시되 진실로 진실로 네게 이르노니 사람이 거듭나지 아니하면 하나님의 나라를 볼 수 없느니라", commentary: { level1: "거듭남이란 우리의 힘이 아닌 위로부터 주시는 새 생명으로 다시 태어나는 것입니다.", level2: "육신의 생명에 머물지 않고 성령으로 말미암아 영적으로 완전히 새로워짐을 의미합니다.", level3: "안네오겐(An-hothen, 위로부터/다시)의 은혜로 말미암는 구속사의 핵심 선언입니다." }, application: { level1: "내 생각과 고집을 내려놓고 주님이 주시는 새로운 마음을 품으세요.", level2: "과거의 상처와 죄악에 얽매이지 말고 매일 성령 안에서 새로워지십시오.", level3: "복음을 전할 때 인간적 교훈을 넘어 '거듭남'의 본질을 선포해야 합니다." } },
                    { verse: 16, text: "하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라", commentary: { level1: "성경 전체의 핵심이자, 하나님이 우리를 향해 품으신 가장 깊은 사랑의 확증입니다.", level2: "죄로 인해 죽을 수밖에 없는 우리를 구원하시기 위해 독생자 예수 그리스도를 아낌없이 내어주신 은혜입니다.", level3: "아가페 사랑의 절정이자 십자가 대속의 구속 경륜을 가장 압축적으로 보여줍니다." }, application: { level1: "나는 하나님께 세상 무엇과도 바꿀 수 없는 소중한 존재임을 기억하세요.", level2: "나를 향한 이 한없는 사랑을 의지하여 오늘도 담대하게 살아가십시오.", level3: "이 십자가의 사랑을 내 이웃과 세상에 빚진 자의 심정으로 전파해야 합니다." } }
                ]
            },
            "mat_1": {
                book: "마태복음", chapter: 1,
                verses: [
                    { verse: 1, text: "아브라함과 다윗의 자손 예수 그리스도의 족보라", commentary: { level1: "예수님은 하나님의 약속대로 역사 속의 왕과 조상들의 후손으로 이 땅에 오셨습니다.", level2: "구약의 모든 언약이 예수 그리스도 안에서 성취됨을 보여주는 구속사적 선언입니다.", level3: "메시아의 정통성과 언약 성취의 역사성을 확증하는 마태복음의 서두입니다." }, application: { level1: "내 인생의 복잡한 역사 속에서도 하나님은 신실하게 일하고 계십니다.", level2: "하나님의 언약은 반드시 이루어짐을 믿고 소망을 가지십시오.", level3: "하나님의 구속 경륜 안에서 내 삶의 자리와 사명을 발견해야 합니다." } },
                    { verse: 21, text: "아들을 낳으리니 이름을 예수라 하라 이는 그가 자기 백성을 그들의 죄에서 구원할 자이심이라 하니라", commentary: { level1: "예수라는 이름의 뜻은 '자기 백성을 죄에서 구원할 자'라는 구원의 소망입니다.", level2: "인류의 가장 근본적인 문제인 죄를 해결하시기 위해 오신 유일한 구세주이십니다.", level3: "임마누엘 성취의 전 단계로서 십자가 대속의 목적을 명확히 계시합니다." }, application: { level1: "오늘도 나를 죄와 절망에서 건져주시는 예수님의 이름을 부르십시오.", level2: "내 힘으로 해결할 수 없는 무거운 짐을 주님께 온전히 맡기십시오.", level3: "구원의 은혜를 입은 자로서 거룩한 백성의 정체성을 지켜야 합니다." } }
                ]
            }
        };

        const bibleBookMeta = {
            ot: [
                { name: "창세기", code: "gen", chapters: 50 },
                { name: "출애굽기", code: "exo", chapters: 40 }
            ],
            nt: [
                { name: "마태복음", code: "mat", chapters: 28 },
                { name: "요한복음", code: "jhn", chapters: 21 }
            ]
        };

        const topicsData = {
            "마음의 평안": {
                reference: "요한복음 14:27",
                text: "평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것과 같지 아니하니라 너희는 마음에 근심하지도 말고 두려워하지도 말라",
                commentary: {
                    level1: "주님이 주시는 평안은 세상의 조건과 상관없이 마음을 깊이 감싸주는 참된 안식입니다.",
                    level2: "불안과 염려가 밀려올 때 주님의 약속을 붙들면 세상이 뺏을 수 없는 평안이 임합니다.",
                    level3: "그리스도와의 연합 안에서 누리는 샬롬은 환난 중에도 흔들리지 않는 영적 요새입니다."
                },
                application: {
                    level1: "불안할 때마다 숨을 깊이 쉬고 주님의 이름을 부르며 마음을 가라앉히세요.",
                    level2: "상황을 바꾸려 애쓰기보다 주님의 손에 모든 염려를 온전히 맡겨드리십시오.",
                    level3: "불안해하는 주변 지체들에게 영적 안식을 주는 위로의 통로가 되십시오."
                }
            },
            "새로운 힘과 용기": {
                reference: "이사야 40:31",
                text: "오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리가 날개치며 올라감 같을 것이요 달음박질하여도 곤비하지 아니하겠고 걸어가도 피곤하지 아니하리로다",
                commentary: {
                    level1: "내 힘이 바닥났을 때 하나님을 바라보면 하늘로부터 지치지 않는 새 에너지가 부어집니다.",
                    level2: "인생의 달음박질과 평탄치 않은 걸음 속에서도 하나님이 공급하시는 능력으로 완주하게 됩니다.",
                    level3: "자기 의뢰를 내려놓고 온전히 하나님만을 의존할 때 주어지는 초자연적 회복의 은혜입니다."
                },
                application: {
                    level1: "지칠 때 혼자 버티지 말고 기도로 하늘의 능력을 공급받으십시오.",
                    level2: "내 능력의 한계를 인정하고 주님이 주시는 페이스대로 걸어가세요.",
                    level3: "지친 동료나 가족에게 희망의 메시지를 건네며 함께 일어서십시오."
                }
            }
        };

        function switchMainTab(tab) {
            const isBible = tab === 'bible';
            document.getElementById('view-bible').classList.toggle('hidden', !isBible);
            document.getElementById('view-topics').classList.toggle('hidden', isBible);
            document.getElementById('level-bar').classList.toggle('hidden', !isBible);

            document.getElementById('nav-tab-bible').className = isBible ? "bg-[#E5C158] text-[#24201D] px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow-sm" : "text-[#A6998A] hover:text-[#F7F2EC] px-3.5 py-1.5 rounded-xl text-xs font-semibold transition";
            document.getElementById('nav-tab-topics').className = !isBible ? "bg-[#E5C158] text-[#24201D] px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow-sm" : "text-[#A6998A] hover:text-[#F7F2EC] px-3.5 py-1.5 rounded-xl text-xs font-semibold transition";
            if (isBible) closePanel();
        }

        function loadBibleContent(bookCode, chapter) {
            currentBook = bookCode;
            currentChapter = chapter;
            const key = `${bookCode}_${chapter}`;
            const bookNameMap = { jhn: "요한복음", mat: "마태복음", gen: "창세기", exo: "출애굽기" };
            document.getElementById('current-location-btn').innerText = `${bookNameMap[bookCode] || bookCode} ${chapter}장`;

            const data = mockBibleDatabase[key];
            let listContainer = document.getElementById('verses-list');
            listContainer.innerHTML = "";

            if (data && data.verses) {
                data.verses.forEach((item, index) => {
                    listContainer.innerHTML += `
                        <div onclick="selectVerse('${key}', ${index})" class="p-4 rounded-2xl transition cursor-pointer hover:bg-[#38302A] border border-transparent hover:border-[#52453B] flex items-start space-x-3.5 active:scale-[0.99]">
                            <span class="bg-[#3B322A] text-[#E5C158] font-bold px-2.5 py-1 rounded-xl text-xs mt-0.5 shrink-0 border border-[#52453B]">${item.verse}절</span>
                            <p class="text-[#EDE6DF] flex-1">${item.text}</p>
                        </div>`;
                });
            } else {
                listContainer.innerHTML = `
                    <div class="text-center py-16 text-[#A6998A] space-y-3">
                        <p class="text-base font-bold text-[#F7F2EC]">📖 ${bookNameMap[bookCode]} ${chapter}장 묵상 준비 중</p>
                        <p class="text-xs text-[#8C7D70]">현재 요한복음 3장과 마태복음 1장이 완벽하게 수록되어 있습니다. 샘플을 확인해보세요!</p>
                        <button onclick="loadBibleContent('jhn', 3)" class="mt-2 bg-[#E5C158] text-[#24201D] text-xs font-bold px-4 py-2 rounded-xl shadow">요한복음 3장 보기</button>
                    </div>`;
            }
        }

        function renderTopicsTags() {
            const container = document.getElementById('topic-tags-container');
            container.innerHTML = "";
            Object.keys(topicsData).forEach(topicName => {
                container.innerHTML += `
                    <button onclick="selectTopic('${topicName}')" class="bg-[#38302A] hover:bg-[#4A3F38] text-[#EDE6DF] hover:text-[#E5C158] border border-[#52453B] px-3.5 py-2.5 rounded-xl text-xs font-semibold transition active:scale-95 shadow-sm">
                        # ${topicName}
                    </button>`;
            });
        }

        function selectTopic(topicName) {
            const data = topicsData[topicName];
            if (!data) return;
            let commentaryText = currentLevel === 1 ? data.commentary.level1 : currentLevel === 2 ? data.commentary.level2 : data.commentary.level3;
            let applicationText = currentLevel === 1 ? data.application.level1 : currentLevel === 2 ? data.application.level2 : data.application.level3;
            let levelName = currentLevel === 1 ? '초신자용 주석' : currentLevel === 2 ? '일반 성도용 주석' : '리더·교사용 주해';

            document.getElementById('topic-result-title').innerText = `📌 #${topicName} (${data.reference})`;
            document.getElementById('topic-result-verse').innerText = `"${data.text}"`;
            document.getElementById('topic-result-level-label').innerText = `💡 ${levelName}`;
            document.getElementById('topic-result-commentary').innerText = commentaryText;
            document.getElementById('topic-result-application').innerText = applicationText;

            document.getElementById('topic-result-card').classList.remove('hidden');
            document.getElementById('topic-result-card').scrollIntoView({ behavior: 'smooth' });
        }

        function closeTopicResult() {
            document.getElementById('topic-result-card').classList.add('hidden');
        }

        function selectVerse(key, index) {
            activeVerseIndex = index;
            const data = mockBibleDatabase[key];
            const item = data.verses[index];
            let commentaryText = currentLevel === 1 ? item.commentary.level1 : currentLevel === 2 ? item.commentary.level2 : item.commentary.level3;
            let applicationText = currentLevel === 1 ? item.application.level1 : currentLevel === 2 ? item.application.level2 : item.application.level3;
            let levelName = currentLevel === 1 ? '초신자용 주석' : currentLevel === 2 ? '일반 성도용 주석' : '리더·교사용 주해';

            document.getElementById('panel-title').innerText = `${data.book} ${data.chapter}장 ${item.verse}절`;
            document.getElementById('panel-verse-text').innerText = `"${item.text}"`;
            document.getElementById('panel-level-label').innerText = `💡 ${levelName}`;
            document.getElementById('panel-commentary-text').innerText = commentaryText;
            document.getElementById('panel-application-text').innerText = applicationText;

            document.getElementById('commentary-panel').classList.remove('translate-y-full');
        }

        function closePanel() {
            document.getElementById('commentary-panel').classList.add('translate-y-full');
            activeVerseIndex = null;
        }

        function changeLevel(level) {
            currentLevel = level;
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`btn-${i}`).className = (i === level)
                    ? "py-1.5 text-xs font-bold rounded-xl bg-[#E5C158] text-[#24201D] transition shadow-sm"
                    : "py-1.5 text-xs font-bold rounded-xl text-[#A6998A] hover:text-[#F7F2EC] transition";
            }
            if (activeVerseIndex !== null) {
                selectVerse(`${currentBook}_${currentChapter}`, activeVerseIndex);
            }
        }

        function openBookModal() { document.getElementById('book-modal').classList.remove('hidden'); renderBookGrid(); }
        function closeBookModal() { document.getElementById('book-modal').classList.add('hidden'); }

        function switchTestament(testament) {
            currentTestament = testament;
            document.getElementById('tab-ot').className = testament === 'ot' ? "flex-1 pb-3 text-xs font-bold text-[#E5C158] border-b-2 border-[#E5C158] transition" : "flex-1 pb-3 text-xs font-bold text-[#A6998A] border-b-2 border-transparent transition";
            document.getElementById('tab-nt').className = testament === 'nt' ? "flex-1 pb-3 text-xs font-bold text-[#E5C158] border-b-2 border-[#E5C158] transition" : "flex-1 pb-3 text-xs font-bold text-[#A6998A] border-b-2 border-transparent transition";
            renderBookGrid();
        }

        function renderBookGrid() {
            const container = document.getElementById('book-grid-container');
            const books = bibleBookMeta[currentTestament];
            let html = '<div class="grid grid-cols-1 gap-3 max-w-md mx-auto">';
            books.forEach(b => {
                html += `<div class="bg-[#2D2723] border border-[#3E352E] rounded-2xl p-4 space-y-3 shadow-sm">
                    <div class="flex justify-between items-center"><span class="font-bold text-sm text-[#F7F2EC]">${b.name}</span><span class="text-xs text-[#A6998A] bg-[#1A1715] px-2.5 py-1 rounded-xl">총 ${b.chapters}장</span></div>
                    <div class="flex flex-wrap gap-2">`;
                for (let c = 1; c <= Math.min(b.chapters, 3); c++) {
                    let isActive = (currentBook === b.code && currentChapter === c);
                    let activeClass = isActive ? 'bg-[#E5C158] text-[#24201D] font-bold shadow-sm' : 'bg-[#1A1715] text-[#EDE6DF] hover:bg-[#38302A] border border-[#3E352E]';
                    html += `<button onclick="selectBookAndChapter('${b.code}', ${c})" class="w-10 h-10 rounded-xl text-xs font-semibold ${activeClass} transition flex items-center justify-center">${c}장</button>`;
                }
                html += `</div></div>`;
            });
            container.innerHTML = html + '</div>';
        }

        function selectBookAndChapter(code, chapter) {
            closeBookModal();
            closePanel();
            loadBibleContent(code, chapter);
        }

        // 초기 실행
        loadBibleContent('jhn', 3);
        renderTopicsTags();
    </script>
</body>

</html>
