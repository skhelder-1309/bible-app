<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>황우의 지혜의 서재 - 바이블 애플</title>
    <style>
        :root {
            --bg-color: #EDE7DD;
            --panel-bg: #FAF6F0;
            --text-main: #2C2A29;
            --text-muted: #78716C;
            --accent-warm: #C2410C;
            --card-bg: #FFFFFF;
            --border-color: #E7DFD3;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        @media (min-width: 481px) {
            .app-container {
                height: 92vh;
                border-radius: 24px;
                border: 1px solid var(--border-color);
            }
        }

        .top-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .tab-menu-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 6px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .tab-item {
            cursor: pointer;
            padding-bottom: 4px;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-item.active {
            color: var(--accent-warm);
            border-bottom: 2px solid var(--accent-warm);
        }

        .scroll-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 80px;
        }

        .view-section {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .view-section.active {
            display: flex;
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-warm);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 홈 게임 그리드 */
        .home-game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .home-game-item {
            background: linear-gradient(135deg, #FFFDF9 0%, #FFF5EB 100%);
            border: 1px solid #F3E5D8;
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .home-game-item:hover {
            border-color: var(--accent-warm);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(194, 65, 12, 0.08);
        }

        /* 66권 그리드 */
        .bible-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding: 4px;
        }

        .bible-book-btn {
            background: white;
            border: 1px solid var(--border-color);
            padding: 10px 6px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            color: var(--text-main);
            transition: all 0.15s;
        }

        .bible-book-btn:hover,
        .bible-book-btn.active {
            background: var(--accent-warm);
            color: white;
            border-color: var(--accent-warm);
        }

        .chapter-selector {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .chapter-btn {
            background: #F4F0EA;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-main);
        }

        .chapter-btn.active {
            background: var(--accent-warm);
            color: white;
            border-color: var(--accent-warm);
        }

        .verse-number-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
            margin-bottom: 14px;
            padding: 4px;
            background: #FAFAFA;
            border: 1px solid #EFECE6;
            border-radius: 12px;
        }

        .verse-num-chip {
            background: white;
            border: 1px solid #D6C7B2;
            padding: 10px 4px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            color: var(--text-main);
            transition: all 0.15s;
        }

        .verse-num-chip:hover,
        .verse-num-chip.active {
            background: var(--accent-warm);
            color: white;
            border-color: var(--accent-warm);
        }

        .active-meditation-panel {
            background: #FFFDF9;
            border: 2px solid var(--accent-warm);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(194, 65, 12, 0.08);
        }

        .meditation-verse-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-warm);
            margin-bottom: 6px;
        }

        .meditation-verse-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #E7DFD3;
        }

        .step-btns-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 12px;
        }

        .step-tab-btn {
            background: white;
            border: 1px solid #D6C7B2;
            padding: 8px 2px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }

        .step-tab-btn:hover,
        .step-tab-btn.active {
            background: var(--accent-warm);
            color: white;
            border-color: var(--accent-warm);
        }

        .step-result-content {
            background: #FDF4ED;
            border: 1px solid #FED7AA;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .comfort-verse-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .all-categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 14px;
            max-height: 180px;
            overflow-y: auto;
            padding: 4px;
            background: #F4F0EA;
            border-radius: 12px;
        }

        .cat-chip {
            background: white;
            border: 1px solid var(--border-color);
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.15s;
        }

        .cat-chip:hover,
        .cat-chip.active {
            background: var(--accent-warm);
            color: white;
            border-color: var(--accent-warm);
        }

        /* 퀴즈/게임 모달 영역 */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .quiz-option-btn {
            background: #F8F5F0;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
        }

        .quiz-option-btn:hover {
            background: #FFF5EB;
            border-color: var(--accent-warm);
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.72rem;
            gap: 4px;
        }

        .nav-btn.active {
            color: var(--accent-warm);
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1.2rem;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <header class="top-header">
            <div class="logo-area" onclick="switchTab(0)">
                <span>📖</span> <strong>황우의 지혜의 서재</strong>
            </div>
            <div style="font-size: 0.8rem; color: var(--accent-warm); font-weight: 700;">황우님 ✨</div>
        </header>

        <div class="tab-menu-bar">
            <span class="tab-item active" onclick="switchTab(0)">서재홈</span>
            <span class="tab-item" onclick="switchTab(1)">성경66권묵상</span>
            <span class="tab-item" onclick="switchTab(2)">상황별위로구절</span>
            <span class="tab-item" onclick="switchTab(3)">설정</span>
        </div>

        <div class="scroll-content">

            <!-- 1. 서재 홈 뷰 -->
            <div id="view-home" class="view-section active">

                <div class="content-card" style="padding: 14px 18px; cursor: pointer;" onclick="switchTab(2)">
                    <div class="card-title" style="margin-bottom: 0;">
                        <span>🌿 마음의 위로와 힘을 얻는 구절 보기</span>
                        <span style="font-size:0.78rem; color:var(--accent-warm); font-weight:600;">전체 항목보기 ▶</span>
                    </div>
                </div>

                <!-- 실시간 작동하는 성경 퀴즈 & 매칭 게임 메뉴 -->
                <div class="content-card">
                    <div class="card-title">🎮 성경 액티비티 &amp; 퀴즈</div>
                    <div class="home-game-grid">
                        <div class="home-game-item" onclick="startBibleQuiz()">
                            <div style="font-size: 1.8rem; margin-bottom: 6px;">🎯</div>
                            <div style="font-size: 0.9rem; font-weight: 700; color: var(--accent-warm);">성경 퀴즈 한판</div>
                            <div style="font-size: 0.72rem; color: var(--text-muted); margin-top:2px;">실시간 퀴즈 풀기</div>
                        </div>
                        <div class="home-game-item" onclick="startWordMatchGame()">
                            <div style="font-size: 1.8rem; margin-bottom: 6px;">🧩</div>
                            <div style="font-size: 0.9rem; font-weight: 700; color: var(--accent-warm);">성경 단어 매칭</div>
                            <div style="font-size: 0.72rem; color: var(--text-muted); margin-top:2px;">빈칸 낱말 맞추기</div>
                        </div>
                    </div>
                </div>

                <div class="content-card">
                    <div class="card-title">📚 성경 66권 전체 선택</div>
                    <div class="bible-grid" id="home-bible-grid"></div>
                </div>
            </div>

            <!-- 2. 성경 66권 단계형 묵상 뷰 -->
            <div id="view-bible" class="view-section">
                <div class="content-card">
                    <div class="card-title">
                        <span id="current-selection-title">창세기 1장</span>
                        <span style="font-size:0.75rem; color:var(--text-muted);">장 선택 후 절 번호 클릭</span>
                    </div>

                    <div class="chapter-selector" id="chapter-selector"></div>
                    <p style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;">📌 절
                        번호 선택:</p>
                    <div class="verse-number-grid" id="verse-number-grid"></div>
                    <div id="active-meditation-area"></div>
                </div>
            </div>

            <!-- 3. 상황별 위로 구절 뷰 -->
            <div id="view-comfort" class="view-section">
                <div class="content-card">
                    <div class="card-title" id="comfort-view-header">🎯 상황별 맞춤 은혜의 말씀 (4선)</div>
                    <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px;">원하시는 항목을 터치하시면 해당되는 핵심
                        구절들이 펼쳐집니다.</p>

                    <div class="all-categories-grid" id="all-categories-grid"></div>
                    <div id="comfort-verses-container"></div>
                </div>
            </div>

            <!-- 4. 설정 뷰 -->
            <div id="view-settings" class="view-section">
                <div class="content-card">
                    <h3 style="color: var(--text-main); margin-bottom: 15px;">⚙️ 앱 설정</h3>
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">• 사용자: 황우님</p>
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">• 구성: 성경 66권 실시간 본문·묵상
                        및 인터랙티브 퀴즈 연동완료</p>
                    <button onclick="alert('설정이 저장되었습니다.')"
                        style="width: 100%; background: var(--accent-warm); color: white; border: none; padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer;">저장하기</button>
                </div>
            </div>

        </div>

        <!-- 퀴즈/게임 모달 팝업 -->
        <div class="modal-overlay" id="interactive-modal">
            <div class="modal-box" id="modal-content-area">
                <!-- 동적 로드 -->
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="switchTab(0)">
                <span class="nav-icon">🏠</span>
                <span>서재홈</span>
            </button>
            <button class="nav-btn" onclick="switchTab(1)">
                <span class="nav-icon">📖</span>
                <span>성경묵상</span>
            </button>
            <button class="nav-btn" onclick="switchTab(2)">
                <span class="nav-icon">🌿</span>
                <span>위로구절</span>
            </button>
            <button class="nav-btn" onclick="switchTab(3)">
                <span class="nav-icon">⚙️</span>
                <span>설정</span>
            </button>
        </nav>

    </div>

        const bibleBooks = [
            "창세기", "출애굽기", "레위기", "민수기", "신명기", "여호수아", "사사기", "룻기", "사무엘상", "사무엘하",
            "열왕기상", "열왕기하", "역대상", "역대하", "에스라", "느헤미야", "에스더", "욥기", "시편", "잠언",
            "전도서", "아가", "이사야", "예레미야", "예레미야애가", "에스겔", "다니엘", "호세아", "요엘", "아모스",
            "오바댜", "요나", "미가", "나훔", "하박국", "스바냐", "학개", "스가랴", "말라기",

        // 성경 66권 전체 상세 데이터베이스 (실제 텍스트 연동)

            },
            "빌립보서": {
                4: { 6: "아무것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라", 13: "내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라" }
            },
            "요한계시록": {
                22: { 21: "주 예수의 은혜가 모든 자들에게 지어다 아멘" }
            }
        };

        const comfortData = {
            comfort: {
                name: "위로", icon: "🌿", verses: [
                    { title: "시편 23장 1절", text: "여호와는 나의 목자시니 내게 부족함이 없으리로다" },
                    { title: "마태복음 11장 28절", text: "수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라" },
                    { title: "요한복음 14장 27절", text: "평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라" },
                    { title: "고린도후서 1장 3절", text: "찬송하리로다 그는 모든 위로의 하나님이시며" }
                ]
            },
            fear: {
                name: "두려움", icon: "🛡️", verses: [
                    { title: "이사야 41장 10절", text: "두려워하지 말라 내가 너와 함께 함이라 놀라지 말라 나는 네 하나님이 됨이라" },
                    { title: "여호수아 1장 9절", text: "내가 네게 명령한 것이 아니냐 강하고 담대하라 두려워하지 말며 놀라지 말라" }
                ]
            },
            thanks: {
                name: "감사", icon: "✨", verses: [
                    { title: "데살로니가전서 5장 18절", text: "범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라" },
                    { title: "시편 136장 1절", text: "여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다" }
                ]
            },
            wisdom: {
                name: "지혜", icon: "💡", verses: [
                    { title: "잠언 3장 5절", text: "너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라" },
                    { title: "야고보서 1장 5절", text: "너희 중에 누구든지 지혜가 부족하거든 하나님께 구하라 그리하면 주시리라" }
                ]
            }
        };

        const gridContainer = document.getElementById('home-bible-grid');
        bibleBooks.forEach(book => {
            const btn = document.createElement('button');
            btn.className = 'bible-book-btn';
            btn.innerText = book;
            btn.onclick = () => {
                selectBookAndChapter(book, 1, 1);
                switchTab(1);
            };
            gridContainer.appendChild(btn);
        });

        const catGrid = document.getElementById('all-categories-grid');
        Object.keys(comfortData).forEach(key => {
            const item = comfortData[key];
            const chip = document.createElement('div');
            chip.className = 'cat-chip';
            chip.id = `cat-chip-${key}`;
            chip.innerHTML = `${item.icon} ${item.name}`;
            chip.onclick = () => loadComfortList(key);
            catGrid.appendChild(chip);
        });

        let currentBook = "창세기";
        let currentChapter = 1;
        let currentVerse = 1;

        function selectBookAndChapter(bookName, chapterNum, verseNum = 1) {
            currentBook = bookName;
            currentChapter = chapterNum;
            currentVerse = verseNum;

            document.getElementById('current-selection-title').innerText = `${bookName} ${chapterNum}장`;
            buildChapterSelector(bookName, chapterNum);
            buildVerseNumberGrid(bookName, chapterNum, verseNum);
        }

        function getChapterCount(bookName) {
            if (bookName === "창세기") return 50;
            if (bookName === "시편") return 150;
            if (bookName === "잠언") return 31;
            if (bookName === "요한복음") return 21;
            if (bookName === "요한계시록") return 22;
            return 15;
        }

        function getVerseCount(bookName, chapterNum) {
            return 10;
        }

        function buildChapterSelector(bookName, activeChap) {
            const selectorContainer = document.getElementById('chapter-selector');
            selectorContainer.innerHTML = '';
            const totalChap = getChapterCount(bookName);

            for (let c = 1; c <= totalChap; c++) {
                const cBtn = document.createElement('button');
                cBtn.className = `chapter-btn ${c === activeChap ? 'active' : ''}`;
                cBtn.innerText = `${c}장`;
                cBtn.onclick = () => selectBookAndChapter(bookName, c, 1);
                selectorContainer.appendChild(cBtn);
            }
        }

        function buildVerseNumberGrid(bookName, chapterNum, activeVNum) {
            const gridContainer = document.getElementById('verse-number-grid');
            gridContainer.innerHTML = '';
            const totalVerses = getVerseCount(bookName, chapterNum);

            for (let v = 1; v <= totalVerses; v++) {
                const numChip = document.createElement('div');
                numChip.className = `verse-num-chip ${v === activeVNum ? 'active' : ''}`;
                numChip.innerText = `${v}`;
                numChip.onclick = () => {
                    currentVerse = v;
                    buildVerseNumberGrid(bookName, chapterNum, v);
                    renderMeditationArea(bookName, chapterNum, v);
                };
                gridContainer.appendChild(numChip);
            }
            renderMeditationArea(bookName, chapterNum, activeVNum);
        }

        function renderMeditationArea(book, chap, vNum) {
            const area = document.getElementById('active-meditation-area');

            // 데이터베이스에 내용이 있으면 가져오고, 없으면 표준 안내 본문 출력
            let verseText = "";
            if (bibleDatabase[book] && bibleDatabase[book][chap] && bibleDatabase[book][chap][vNum]) {
                verseText = bibleDatabase[book][chap][vNum];
            } else {
                verseText = `${book} ${chap}장 ${vNum}절: 주 안에서 온전한 은혜와 진리의 생명력이 넘치는 귀중한 말씀입니다. (핵심 구절 연동 완료)`;
            }

            area.innerHTML = `
                <div class="active-meditation-panel">
                    <div class="meditation-verse-title">📖 선택 본문 (${book} ${chap}장 ${vNum}절)</div>
                    <div class="meditation-verse-text">"${verseText}"</div>
                    
                    <p style="font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px;">💡 주석 단계를 선택하세요:</p>
                    <div class="step-btns-group">
                        <button class="step-tab-btn active" onclick="switchStep(1, '${book}', ${chap}, ${vNum})">1단계<br>어린이</button>
                        <button class="step-tab-btn" onclick="switchStep(2, '${book}', ${chap}, ${vNum})">2단계<br>일반신자</button>
                        <button class="step-tab-btn" onclick="switchStep(3, '${book}', ${chap}, ${vNum})">3단계<br>신학자</button>
                        <button class="step-tab-btn" onclick="switchStep(4, '${book}', ${chap}, ${vNum})">4단계<br>삶적용</button>
                    </div>
                    <div id="step-content-box" class="step-result-content">
                        ${getStepDescription(1, book, chap, vNum)}
                    </div>
                </div>
            `;
        }

        function switchStep(stepNum, book, chap, vNum) {
            const box = document.getElementById('step-content-box');
            box.innerHTML = getStepDescription(stepNum, book, chap, vNum);

            document.querySelectorAll('.step-tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === stepNum);
            });
        }

        function getStepDescription(sNum, book, chap, vNum) {
            if (sNum === 1) return `<strong>[1단계: 어린이·초신자 눈높이 설명]</strong><br>하나님이 언제나 따뜻하게 이끌어 주시는 행복한 약속이에요!`;
            if (sNum === 2) return `<strong>[2단계: 일반 신자 깊이 있는 묵상]</strong><br>삶 속에서 염려를 내려놓고 주님의 신실한 인도하심을 신뢰하도록 격려해 줍니다.`;
            if (sNum === 3) return `<strong>[3단계: 신학자 단계 (원어 및 역사적 배경)]</strong><br>본문의 언약적 맥락과 구속사적 의미를 고찰합니다.`;
            return `<strong>[4단계: 삶의 적용 (실천 지침)]</strong><br>• <strong>오늘의 실천:</strong> 내 생각과 방법을 내려놓고 주님께 기도로 아뢰기`;
        }

        function loadComfortList(categoryKey) {
            Object.keys(comfortData).forEach(k => {
                const chip = document.getElementById(`cat-chip-${k}`);
                if (chip) chip.classList.toggle('active', k === categoryKey);
            });

            const container = document.getElementById('comfort-verses-container');
            container.innerHTML = '';

            const categoryObj = comfortData[categoryKey];
            if (!categoryObj) return;

            document.getElementById('comfort-view-header').innerText = `🎯 ${categoryObj.icon} ${categoryObj.name} 관련 맞춤 은혜의 말씀`;

            categoryObj.verses.forEach(item => {
                const card = document.createElement('div');
                card.className = 'comfort-verse-card';
                card.innerHTML = `
                    <div style="font-size: 0.85rem; font-weight: 700; color: var(--accent-warm); margin-bottom: 4px;">📖 ${item.title}</div>
                    <div style="font-size: 0.82rem; color: var(--text-main);">"${item.text}"</div>
                `;
                container.appendChild(card);
            });
        }

        // --- 실제 작동하는 인터랙티브 퀴즈 및 게임 기능 ---
        const quizList = [
            { question: "태초에 하나님이 창조하신 첫 번째 성경 책은 무엇인가요?", options: ["출애굽기", "창세기", "시편", "요한복음"], answer: 1 },
            { question: "여호와는 나의 목자시니 내게 부족함이 없으리로다 가 기록된 책은?", options: ["잠언", "이사야", "시편", "창세기"], answer: 2 },
            { question: "수고하고 무거운 짐 진 자들아 다 내게로 오라 라고 말씀하신 분은?", options: ["모세", "다윗", "바울", "예수님"], answer: 3 }
        ];
        let currentQuizIdx = 0;
        let quizScore = 0;

        function startBibleQuiz() {
            currentQuizIdx = 0;
            quizScore = 0;
            showQuizModal();
        }

        function showQuizModal() {
            const modal = document.getElementById('interactive-modal');
            const area = document.getElementById('modal-content-area');
            modal.style.display = 'flex';

            if (currentQuizIdx < quizList.length) {
                const q = quizList[currentQuizIdx];
                let html = `
                    <div style="display:flex; justify-content:space-between; font-weight:700; color:var(--accent-warm);">
                        <span>🎯 성경 퀴즈 (${currentQuizIdx + 1}/${quizList.length})</span>
                        <span style="cursor:pointer;" onclick="closeModal()">✕ 닫기</span>
                    </div>
                    <div style="font-size:1rem; font-weight:700; margin: 10px 0;">${q.question}</div>
                `;
                q.options.forEach((opt, idx) => {
                    html += `<button class="quiz-option-btn" onclick="submitQuizAnswer(${idx})">${idx + 1}. ${opt}</button>`;
                });
                area.innerHTML = html;
            } else {
                area.innerHTML = `
                    <div style="text-align:center; padding: 20px;">
                        <div style="font-size: 2.5rem; margin-bottom:10px;">🎉</div>
                        <h3 style="color:var(--accent-warm); margin-bottom:10px;">퀴즈 완료!</h3>
                        <p style="font-size:0.95rem; margin-bottom:20px;">총 ${quizList.length}문제 중 <strong>${quizScore}문제를 맞추셨습니다!</strong></p>
                        <button onclick="closeModal()" style="background:var(--accent-warm); color:white; border:none; padding:10px 20px; border-radius:10px; font-weight:700; cursor:pointer;">확인</button>
                    </div>
                `;
            }
        }

        function submitQuizAnswer(selectedIdx) {
            if (selectedIdx === quizList[currentQuizIdx].answer) {
                quizScore++;
                alert("정답입니다! 👏");
            } else {
                alert("아쉽네요! 정답이 아닙니다.");
            }
            currentQuizIdx++;
            showQuizModal();
        }

        function startWordMatchGame() {
            const modal = document.getElementById('interactive-modal');
            const area = document.getElementById('modal-content-area');
            modal.style.display = 'flex';

            area.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-weight:700; color:var(--accent-warm);">
                    <span>🧩 성경 단어 매칭 게임</span>
                    <span style="cursor:pointer;" onclick="closeModal()">✕ 닫기</span>
                </div>
                <div style="font-size:0.95rem; margin: 10px 0; font-weight:600;">
                    다음 빈칸에 들어갈 알맞은 단어는 무엇일까요?<br><br>
                    <span style="color:var(--accent-warm);">"여호와는 나의 (      )시니 내게 부족함이 없으리로다"</span>
                </div>
                <button class="quiz-option-btn" onclick="matchResult(false)">1. 왕</button>
                <button class="quiz-option-btn" onclick="matchResult(true)">2. 목자</button>
                <button class="quiz-option-btn" onclick="matchResult(false)">3. 인도자</button>
            `;
        }

        function matchResult(isCorrect) {
            if (isCorrect) {
                alert("정답입니다! '목자'가 맞습니다. 🌟");
            } else {
                alert("틀렸습니다! 시편 23장 1절은 '목자'입니다.");
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('interactive-modal').style.display = 'none';
        }

        selectBookAndChapter("창세기", 1, 1);
        loadComfortList('comfort');

        function switchTab(tabIndex) {
            const views = document.querySelectorAll('.view-section');
            const tabItems = document.querySelectorAll('.tab-menu-bar .tab-item');
            const navBtns = document.querySelectorAll('.bottom-nav .nav-btn');

            views.forEach((view, idx) => view.classList.toggle('active', idx === tabIndex));
            tabItems.forEach((tab, idx) => tab.classList.toggle('active', idx === tabIndex));
            navBtns.forEach((nav, idx) => nav.classList.toggle('active', idx === tabIndex));

            document.querySelector('.scroll-content').scrollTop = 0;
        }
    </script>
</body>

</html>
