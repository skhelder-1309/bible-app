<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성경 및 깊은 주석 뷰어</title>
    <style>
        :root {
            --bg-color: #EDE8DD;
            --panel-bg: #F9F6F0;
            --text-main: #2C2A29;
            --text-muted: #6B655E;
            --accent: #8C6D46;
            --accent-hover: #735735;
            --border-color: #D6CEBE;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 공통 헤더 */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 4px var(--shadow);
            z-index: 100;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
        }

        /* 1. 메인 홈 화면 스타일 */
        #homeScreen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }

        .home-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .home-card h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .home-card p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .start-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .start-btn:hover {
            background-color: var(--accent-hover);
        }

        /* 2. 성경 뷰어 화면 스타일 (기본 숨김) */
        #viewerScreen {
            flex: 1;
            display: none;
            flex-direction: row;
            overflow: hidden;
        }

        /* 사이드바 */
        aside {
            width: 280px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            background-color: #F4EFE6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1rem;
        }

        .testament-tabs {
            display: flex;
            background-color: #EBE5DB;
            padding: 4px;
            gap: 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 6px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
        }

        .tab-btn.active {
            background-color: var(--panel-bg);
            color: var(--accent);
        }

        .book-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .book-item {
            padding: 10px 12px;
            margin-bottom: 3px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .book-item:hover {
            background-color: #EFE9DC;
        }

        .book-item.selected {
            background-color: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* 메인 읽기 영역 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        .main-header {
            padding: 15px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .main-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-header h3 {
            font-size: 1.2rem;
        }

        .chapter-selector {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            max-width: 100%;
        }

        .chapter-btn {
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .chapter-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .content-body {
            flex: 1;
            display: flex;
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
        }

        .panel {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 2px 6px var(--shadow);
        }

        .panel h4 {
            margin-bottom: 12px;
            font-size: 1rem;
            color: var(--accent);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
        }

        .verse-item {
            margin-bottom: 10px;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .verse-num {
            font-weight: bold;
            color: var(--accent);
            margin-right: 6px;
        }

        .commentary-content {
            line-height: 1.6;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* 📱 모바일 화면 대응 (반응형 미디어 쿼리) */
        @media (max-width: 768px) {
            #viewerScreen {
                flex-direction: column;
                /* 모바일에서는 위아래로 배치 */
            }

            aside {
                width: 100%;
                height: 160px;
                /* 모바일에서는 사이드바 높이 고정 후 스크롤 */
            }

            .content-body {
                flex-direction: column;
                padding: 10px;
                gap: 10px;
            }

            .panel {
                max-height: 300px;
                /* 모바일에서 각 패널 높이 제한 */
            }
        }
    </style>
</head>

<body>

    <!-- 공통 상단 네비게이션 -->
    <header>
        <a class="logo" onclick="goHome()">📖 성경 및 깊은 주석 서재</a>
        <span id="homeIndicator" style="font-size: 0.85rem; color: var(--text-muted);">홈 화면</span>
    </header>

    <!-- 1. 메인 홈 화면 -->
    <div id="homeScreen">
        <div class="home-card">
            <h1>성경 및 깊은 주석</h1>
            <p>구약 39권과 신약 27권 전체 성경 본문과<br>깊이 있는 주석 및 강해를 편리하게 읽어보세요.</p>
            <button class="start-btn" onclick="startViewer()">성경 읽기 시작하기</button>
        </div>
    </div>

    <!-- 2. 성경 뷰어 화면 -->
    <div id="viewerScreen">
        <aside>
            <div class="sidebar-header">
                <h2>성경 목록</h2>
                <button onclick="goHome()"
                    style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:0.85rem; font-weight:600;">홈으로</button>
            </div>
            <div class="testament-tabs">
                <button class="tab-btn active" onclick="switchTestament('ot')">구약 (39)</button>
                <button class="tab-btn" onclick="switchTestament('nt')">신약 (27)</button>
            </div>
            <div class="book-list" id="bookList"></div>
        </aside>

        <main>
            <div class="main-header">
                <div class="main-header-top">
                    <h3 id="currentTitle">창세기 1장</h3>
                </div>
                <div class="chapter-selector" id="chapterSelector"></div>
            </div>
            <div class="content-body">
                <div class="panel">
                    <h4>성경 본문</h4>
                    <div id="verseContainer"></div>
                </div>
                <div class="panel">
                    <h4>깊은 주석 및 해설</h4>
                    <div class="commentary-content" id="commentaryContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const otBooks = ["창세기", "출애굽기", "레위기", "민수기", "신명기", "여호수아", "사사기", "룻기", "사무엘상", "사무엘하", "열왕기상", "열왕기하", "역대상", "역대하", "에스라", "느헤미야", "에스더", "욥기", "시편", "잠언", "전도서", "아가", "이사야", "예레미야", "예레미야애가", "에스겔", "다니엘", "호세아", "요엘", "아모스", "오바댜", "요나", "미가", "나훔", "하박국", "스바냐", "학개", "스가랴", "말라기"];
        const ntBooks = ["마태복음", "마가복음", "누가복음", "요한복음", "사도행전", "로마서", "고린도전서", "고린도후서", "갈라디아서", "에베소서", "빌립보서", "골로새서", "데살로니가전서", "데살로니가후서", "디모데전서", "디모데후서", "디도서", "빌레몬서", "히브리서", "야고보서", "베드로전서", "베드로후서", "요한일서", "요한이서", "요한삼서", "유다서", "요한계시록"];

        let currentTestament = 'ot';
        let currentBook = '창세기';
        let currentChapter = 1;

        function goHome() {
            document.getElementById('homeScreen').style.display = 'flex';
            document.getElementById('viewerScreen').style.display = 'none';
            document.getElementById('homeIndicator').innerText = '홈 화면';
        }

        function startViewer() {
            document.getElementById('homeScreen').style.display = 'none';
            document.getElementById('viewerScreen').style.display = 'flex';
            document.getElementById('homeIndicator').innerText = '성경 뷰어 모드';
            renderBooks();
            renderChapters();
            renderContent();
        }

        function switchTestament(testament) {
            currentTestament = testament;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            currentBook = testament === 'ot' ? otBooks[0] : ntBooks[0];
            currentChapter = 1;
            renderBooks();
            renderChapters();
            renderContent();
        }

        function renderBooks() {
            const bookListEl = document.getElementById('bookList');
            bookListEl.innerHTML = '';
            const books = currentTestament === 'ot' ? otBooks : ntBooks;

            books.forEach(book => {
                const div = document.createElement('div');
                div.className = `book-item ${book === currentBook ? 'selected' : ''}`;
                div.innerText = book;
                div.onclick = () => {
                    currentBook = book;
                    currentChapter = 1;
                    renderBooks();
                    renderChapters();
                    renderContent();
                };
                bookListEl.appendChild(div);
            });
        }

        function renderChapters() {
            const selectorEl = document.getElementById('chapterSelector');
            selectorEl.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = `chapter-btn ${i === currentChapter ? 'active' : ''}`;
                btn.innerText = `${i}장`;
                btn.onclick = () => {
                    currentChapter = i;
                    renderChapters();
                    renderContent();
                };
                selectorEl.appendChild(btn);
            }
        }

        function renderContent() {
            document.getElementById('currentTitle').innerText = `${currentBook} ${currentChapter}장`;

            const verseContainer = document.getElementById('verseContainer');
            verseContainer.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const p = document.createElement('div');
                p.className = 'verse-item';
                p.innerHTML = `<span class="verse-num">${i}</span>${currentBook} ${currentChapter}장 ${i}절의 말씀 내용입니다. 하나님의 은혜와 진리의 말씀이 선포됩니다.`;
                verseContainer.appendChild(p);
            }

            const commentaryContainer = document.getElementById('commentaryContainer');
            commentaryContainer.innerHTML = `
                <p><strong>[${currentBook} ${currentChapter}장 깊은 주석]</strong></p><br>
                <p>1. <strong>문맥적 이해:</strong> 본 장은 전체 구속사 속에서 중요한 위치를 차지하며, 독자들에게 큰 영적 통찰을 제공합니다.</p><br>
                <p>2. <strong>신학적 메시지:</strong> 하나님의 신실하심과 언약 성취의 역사를 보여줍니다.</p>
            `;
        }
    </script>
</body>

</html>
