<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>바른 성경 주석</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            font-family: 'Pretendard', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col select-none">

    <!-- 상단 고정 네비게이션 앱바 -->
    <header
        class="bg-slate-950/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-xl">📖</span>
            <h1 class="font-bold text-base tracking-tight text-white">정통 성경 주석</h1>
        </div>
        <!-- 책/장 선택 버튼 -->
        <button onclick="openBookModal()"
            class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition px-3 py-1.5 rounded-full text-xs font-semibold text-blue-400 border border-slate-700 flex items-center space-x-1">
            <span id="current-location-btn">요한복음 3장</span>
            <svg class="w-3.5 h-3.5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
    </header>

    <!-- 난이도 선택 플로팅 바 -->
    <div class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-2.5 sticky top-[53px] z-20">
        <div class="max-w-md mx-auto grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800/80">
            <button onclick="changeLevel(1)" id="btn-1"
                class="py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white transition shadow-sm">초신자용</button>
            <button onclick="changeLevel(2)" id="btn-2"
                class="py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">일반 성도</button>
            <button onclick="changeLevel(3)" id="btn-3"
                class="py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">리더·교사</button>
        </div>
    </div>

    <!-- 메인 성경 본문 뷰 (절 터치 방식) -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-3 pb-24">
        <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4 shadow-lg">
            <p class="text-xs text-blue-400 font-semibold mb-3">💡 아래 성경 절 번호를 터치하면 해당 주석이 열립니다.</p>
            <div id="verses-list" class="space-y-3 font-serif leading-relaxed text-slate-200">
                <!-- 동적으로 본문 리스트가 생성됩니다 -->
            </div>
        </div>
    </main>

    <!-- 선택된 절 주석 표시 패널 (하단 고정 슬라이드업 카드) -->
    <div id="commentary-panel"
        class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 p-5 z-40 transform translate-y-full transition-transform duration-300 shadow-2xl max-h-[60vh] overflow-y-auto">
        <div class="max-w-md mx-auto space-y-3">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <span id="panel-title" class="text-sm font-bold text-blue-400">주석 내용</span>
                <button onclick="closePanel()"
                    class="text-slate-400 hover:text-white text-xs font-semibold px-2 py-1 bg-slate-900 rounded-lg">닫기
                    ✕</button>
            </div>
            <p id="panel-verse-text" class="text-xs text-slate-400 italic"></p>
            <div class="bg-slate-900 border border-slate-800/80 p-3.5 rounded-xl">
                <span id="panel-level-label"
                    class="text-[11px] font-bold text-blue-400 uppercase tracking-wider block mb-1">주석</span>
                <p id="panel-commentary-text" class="text-slate-200 text-sm leading-relaxed"></p>
            </div>
        </div>
    </div>

    <!-- 성경 66권 선택 모달 -->
    <div id="book-modal"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end transition-opacity">
        <div class="bg-slate-900 border-t border-slate-800 rounded-t-3xl max-h-[80vh] flex flex-col p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 class="font-bold text-base text-white">성경 및 장 선택</h3>
                <button onclick="closeBookModal()"
                    class="text-slate-400 hover:text-white text-sm font-semibold px-2 py-1">닫기</button>
            </div>
            <div id="book-list-container" class="overflow-y-auto space-y-4 pr-1">
                <div class="space-y-2">
                    <p class="text-xs font-bold text-slate-400">신약 성경</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="selectBook('jhn')"
                            class="p-3 bg-slate-800 hover:bg-blue-600 text-left rounded-xl text-sm font-medium transition text-white">요한복음
                            3장</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 하단 네비게이션 바 -->
    <footer
        class="bg-slate-950 border-t border-slate-800 py-3 text-center text-xs text-slate-500 fixed bottom-0 left-0 right-0 z-20">
        개역개정 정통 보수주의 주석 시스템
    </footer>

    <script>
        let currentData = null;
        let currentLevel = 1;
        let activeVerseIndex = null;

        async function loadBookData(bookCode) {
            try {
                const response = await fetch(`${bookCode}.json`);
                currentData = await response.json();
                render();
            } catch (error) {
                document.getElementById('verses-list').innerHTML = `
                    <div class="text-center py-10 text-slate-400 space-y-2">
                        <p class="text-base">🚧 데이터 준비 중입니다.</p>
                    </div>`;
            }
        }

        function render() {
            if (!currentData) return;
            document.getElementById('current-location-btn').innerText = `${currentData.book} ${currentData.chapter}장`;

            let listContainer = document.getElementById('verses-list');
            listContainer.innerHTML = "";

            currentData.verses.forEach((item, index) => {
                let html = `
                    <div onclick="selectVerse(${index})" class="p-3 rounded-xl transition cursor-pointer hover:bg-slate-800/80 border border-transparent hover:border-slate-700 flex items-start space-x-2">
                        <span class="bg-blue-600/20 text-blue-400 font-bold px-2 py-0.5 rounded text-xs mt-0.5">${item.verse}절</span>
                        <p class="text-slate-300 text-sm flex-1">${item.text}</p>
                    </div>
                `;
                listContainer.innerHTML += html;
            });
        }

        function selectVerse(index) {
            activeVerseIndex = index;
            const item = currentData.verses[index];
            let commentaryText = currentLevel === 1 ? item.commentary.level1 : currentLevel === 2 ? item.commentary.level2 : item.commentary.level3;
            let levelName = currentLevel === 1 ? '초신자용 주석' : currentLevel === 2 ? '일반 성도용 주석' : '리더·교사용(주해)';

            document.getElementById('panel-title').innerText = `${currentData.book} ${currentData.chapter}장 ${item.verse}절`;
            document.getElementById('panel-verse-text').innerText = `"${item.text}"`;
            document.getElementById('panel-level-label').innerText = `💡 ${levelName}`;
            document.getElementById('panel-commentary-text').innerText = commentaryText;

            // 하단 패널 슬라이드 업
            const panel = document.getElementById('commentary-panel');
            panel.classList.remove('translate-y-full');
        }

        function closePanel() {
            const panel = document.getElementById('commentary-panel');
            panel.classList.add('translate-y-full');
            activeVerseIndex = null;
        }

        function changeLevel(level) {
            currentLevel = level;
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`btn-${i}`);
                if (i === level) {
                    btn.className = "py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white transition shadow-sm";
                } else {
                    btn.className = "py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
                }
            }
            // 만약 주석 창이 열려있는 상태라면 난이도 변경 즉시 내용 반영
            if (activeVerseIndex !== null) {
                selectVerse(activeVerseIndex);
            }
        }

        function openBookModal() {
            document.getElementById('book-modal').classList.remove('hidden');
        }

        function closeBookModal() {
            document.getElementById('book-modal').classList.add('hidden');
        }

        function selectBook(code) {
            closeBookModal();
            closePanel();
            loadBookData(code);
        }

        loadBookData('jhn');
    </script>
</body>

</html>
