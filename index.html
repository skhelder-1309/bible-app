<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바른 성경 주석</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- 상단 헤더 -->
    <header class="bg-blue-900 text-white p-4 text-center shadow-md">
        <h1 class="text-xl font-bold">📖 바른 성경 주석</h1>
        <p class="text-xs text-blue-200 mt-1">정통 기독교 개역개정 맞춤형 주석 (3단계 난이도)</p>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-4">
        
        <!-- 성경 선택 내비게이션 박스 -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">성경 선택</label>
                    <select id="book-select" onchange="onBookChange()" class="w-full p-2 text-sm border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="jhn">요한복음 (샘플)</option>
                        <!-- 추후 창세기(gen), 마태복음(mat) 등을 여기에 계속 추가하면 됩니다 -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">장(Chapter)</label>
                    <select id="chapter-select" onchange="onChapterChange()" class="w-full p-2 text-sm border rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="3">3장</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 주석 난이도 선택 버튼 그룹 -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
            <label class="block text-xs font-semibold text-gray-500 mb-2">주석 난이도 선택</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="changeLevel(1)" id="btn-1" class="py-2 text-sm font-medium rounded-lg bg-blue-600 text-white transition shadow-sm">초신자용</button>
                <button onclick="changeLevel(2)" id="btn-2" class="py-2 text-sm font-medium rounded-lg bg-gray-100 text-gray-700 transition hover:bg-gray-200">일반 성도</button>
                <button onclick="changeLevel(3)" id="btn-3" class="py-2 text-sm font-medium rounded-lg bg-gray-100 text-gray-700 transition hover:bg-gray-200">리더·교사</button>
            </div>
        </div>

        <!-- 성경 본문 및 주석 카드 -->
        <div id="content-box" class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 space-y-4">
            <div class="border-b pb-3">
                <span class="text-xs font-bold text-blue-600 uppercase tracking-wider" id="bible-info">로딩 중...</span>
                <div id="verses-container" class="mt-2 space-y-3">
                    <!-- 절별 데이터가 동적으로 들어갑니다 -->
                </div>
            </div>
        </div>
    </main>

    <!-- 하단 푸터 -->
    <footer class="text-center py-4 text-xs text-gray-400">
        © 2026 바른성경주석 프로젝트. All rights reserved.
    </footer>

    <!-- 자바스크립트 데이터 제어 로직 -->
    <script>
        let currentData = null;
        let currentLevel = 1;

        async function loadBookData(bookFileName) {
            try {
                const response = await fetch(`${bookFileName}.json`);
                currentData = await response.json();
                render();
            } catch (error) {
                console.error("데이터 로드 에러:", error);
                document.getElementById('verses-container').innerHTML = "<p class='text-red-500 text-sm'>데이터를 불러오는 중 에러가 발생했습니다.</p>";
            }
        }

        function render() {
            if (!currentData) return;
            
            document.getElementById('bible-info').innerText = `${currentData.book} ${currentData.chapter}장`;
            
            let container = document.getElementById('verses-container');
            container.innerHTML = "";
            
            currentData.verses.forEach(item => {
                let commentaryText = "";
                if (currentLevel === 1) commentaryText = item.commentary.level1;
                else if (currentLevel === 2) commentaryText = item.commentary.level2;
                else if (currentLevel === 3) commentaryText = item.commentary.level3;

                let html = `
                    <div class="space-y-2 pt-2">
                        <p class="text-base font-serif font-medium text-gray-800">
                            <span class="text-blue-600 font-bold mr-1">${item.verse}</span> ${item.text}
                        </p>
                        <div class="text-gray-700 leading-relaxed text-sm bg-blue-50/50 p-3 rounded-lg border border-blue-100/60">
                            <span class="text-xs font-bold text-blue-800 block mb-1">[주석]</span>
                            ${commentaryText}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function changeLevel(level) {
            currentLevel = level;
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`btn-${i}`);
                if (i === level) {
                    btn.className = "py-2 text-sm font-medium rounded-lg bg-blue-600 text-white transition shadow-sm";
                } else {
                    btn.className = "py-2 text-sm font-medium rounded-lg bg-gray-100 text-gray-700 transition hover:bg-gray-200";
                }
            }
            render();
        }

        function onBookChange() {
            const selectedBook = document.getElementById('book-select').value;
            loadBookData(selectedBook);
        }

        function onChapterChange() {
            // 추후 장별 확장 시 연동되는 자리
        }

        // 앱 실행 시 요한복음(jhn.json) 기본 로드
        loadBookData('jhn');
    </script>
</body>
</html>
