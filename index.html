<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>바른 성경 주석 & 맞춤 묵상</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            font-family: 'Pretendard', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col select-none">

    <!-- 상단 고정 네비게이션 앱바 -->
    <header
        class="bg-slate-950/90 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800 px-5 py-3.5 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-2.5">
            <span class="text-2xl">📖</span>
            <h1 class="font-bold text-lg tracking-tight text-white">바른 성경 주석</h1>
        </div>
        <div class="flex space-x-2">
            <button onclick="switchMainTab('bible')" id="nav-tab-bible"
                class="bg-blue-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow">성경
                본문</button>
            <button onclick="switchMainTab('topics')" id="nav-tab-topics"
                class="bg-slate-800 text-slate-400 px-3.5 py-1.5 rounded-xl text-xs font-bold transition">상황별
                묵상</button>
        </div>
    </header>

    <!-- 난이도 선택 플로팅 바 (성경 본문 모드일 때만 표시) -->
    <div id="level-bar"
        class="bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 sticky top-[61px] z-20">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-2xl border border-slate-800 flex-1 mr-2">
                <button onclick="changeLevel(1)" id="btn-1"
                    class="py-1.5 text-xs font-bold rounded-xl bg-blue-600 text-white transition shadow">초신자용</button>
                <button onclick="changeLevel(2)" id="btn-2"
                    class="py-1.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition">일반
                    성도</button>
                <button onclick="changeLevel(3)" id="btn-3"
                    class="py-1.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition">리더·교사</button>
            </div>
            <button onclick="openBookModal()"
                class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition px-3.5 py-2 rounded-xl text-xs font-bold text-blue-400 border border-slate-700 flex items-center space-x-1 shrink-0">
                <span id="current-location-btn">요한복음 3장</span>
                <svg class="w-3.5 h-3.5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- 메인 콘텐츠 뷰 (성경 본문) -->
    <main id="view-bible" class="flex-1 max-w-md w-full mx-auto p-5 space-y-4 pb-32">
        <div class="bg-slate-800/40 border border-slate-800/80 rounded-2xl p-5 shadow-xl">
            <p class="text-xs text-blue-400 font-bold mb-4 flex items-center">
                <span class="mr-1.5">💡</span> 구절을 터치하시면 정통 주석과 삶의 적용이 나타납니다.
            </p>
            <div id="verses-list" class="space-y-4 font-serif leading-loose text-slate-100 text-base"></div>
        </div>
    </main>

    <!-- 메인 콘텐츠 뷰 (상황별 묵상) -->
    <main id="view-topics" class="flex-1 max-w-md w-full mx-auto p-5 space-y-4 pb-32 hidden">
        <div class="bg-slate-800/40 border border-slate-800/80 rounded-2xl p-5 shadow-xl space-y-4">
            <div>
                <h2 class="text-base font-bold text-white flex items-center"><span class="mr-2">🧭</span> 인생 상황별 맞춤 묵상
                </h2>
                <p class="text-xs text-slate-400 mt-1">마음이 향하는 상황이나 주제를 선택해 위로와 지혜를 얻으세요.</p>
            </div>
            <!-- 주제 태그 클라우드 -->
            <div id="topic-tags-container" class="flex flex-wrap gap-2 pt-2"></div>
        </div>
        <!-- 선택된 주제 결과 카드 -->
        <div id="topic-result-card"
            class="bg-slate-950 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-2xl hidden">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <span id="topic-result-title" class="text-sm font-bold text-blue-400">주제</span>
                <button onclick="closeTopicResult()"
                    class="text-slate-400 hover:text-white text-xs font-bold px-2.5 py-1 bg-slate-900 border border-slate-800 rounded-xl">닫기
                    ✕</button>
            </div>
            <p id="topic-result-verse"
                class="text-sm text-slate-200 italic font-serif leading-relaxed bg-slate-900/60 p-3.5 rounded-xl border border-slate-800/60">
            </p>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2">
                <span id="topic-result-level-label"
                    class="text-xs font-bold text-blue-400 uppercase tracking-wider block">주석</span>
                <p id="topic-result-commentary" class="text-slate-100 text-sm leading-relaxed font-sans"></p>
            </div>
            <div class="bg-blue-950/30 border border-blue-900/50 p-4 rounded-2xl space-y-2">
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block flex items-center">
                    <span class="mr-1.5">🌱</span> 삶의 구체적 적용
                </span>
                <p id="topic-result-application" class="text-slate-200 text-sm leading-relaxed font-sans"></p>
            </div>
        </div>
    </main>

    <!-- 선택된 절 주석 및 삶의 적용 표시 패널 (성경 본문용) -->
    <div id="commentary-panel"
        class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 p-6 z-40 transform translate-y-full transition-transform duration-300 shadow-2xl max-h-[75vh] overflow-y-auto rounded-t-3xl">
        <div class="max-w-md mx-auto space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <span id="panel-title" class="text-base font-bold text-blue-400">주석 내용</span>
                <button onclick="closePanel()"
                    class="text-slate-400 hover:text-white text-xs font-bold px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-xl">닫기
                    ✕</button>
            </div>
            <p id="panel-verse-text"
                class="text-sm text-slate-300 italic font-serif leading-relaxed bg-slate-900/60 p-3.5 rounded-xl border border-slate-800/60">
            </p>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-inner space-y-2">
                <span id="panel-level-label"
                    class="text-xs font-bold text-blue-400 uppercase tracking-wider block">주석</span>
                <p id="panel-commentary-text" class="text-slate-100 text-sm leading-relaxed font-sans"></p>
            </div>
            <div class="bg-blue-950/30 border border-blue-900/50 p-4 rounded-2xl space-y-2">
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block flex items-center">
                    <span class="mr-1.5">🌱</span> 삶의 구체적 적용
                </span>
                <p id="panel-application-text" class="text-slate-200 text-sm leading-relaxed font-sans"></p>
            </div>
        </div>
    </div>

    <!-- 성경 66권 전체화면 프리미엄 모달 -->
    <div id="book-modal"
        class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex flex-col transition-opacity">
        <div class="px-5 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-900">
            <h3 class="font-bold text-lg text-white flex items-center"><span class="mr-2">📚</span> 성경 선택</h3>
            <button onclick="closeBookModal()"
                class="text-slate-400 hover:text-white text-sm font-bold bg-slate-800 px-3.5 py-1.5 rounded-xl border border-slate-700">닫기</button>
        </div>
        <div class="flex border-b border-slate-800 bg-slate-900/50 px-5 pt-2">
            <button onclick="switchTestament('ot')" id="tab-ot"
                class="flex-1 pb-3 text-sm font-bold text-slate-400 border-b-2 border-transparent transition">구약
                (39권)</button>
            <button onclick="switchTestament('nt')" id="tab-nt"
                class="flex-1 pb-3 text-sm font-bold text-blue-400 border-b-2 border-blue-500 transition">신약
                (27권)</button>
        </div>
        <div id="book-grid-container" class="flex-1 overflow-y-auto p-5 space-y-6"></div>
    </div>

    <footer
        class="bg-slate-950 border-t border-slate-800 py-3 text-center text-xs text-slate-500 fixed bottom-0 left-0 right-0 z-20">
        개역개정 정통 보수주의 주석 시스템
    </footer>

    <script>
        let currentData = null;
        let currentLevel = 1;
        let activeVerseIndex = null;
        let currentTestament = 'nt';
        let topicsData = {};

        const bibleDataMap = {
            ot: [
                { name: "창세기", code: "gen", chapters: 50 },
                { name: "출애굽기", code: "exo", chapters: 40 },
                { name: "레위기", code: "lev", chapters: 27 },
                { name: "민수기", code: "num", chapters: 36 },
                { name: "신명기", code: "deu", chapters: 34 }
            ],
            nt: [
                { name: "마태복음", code: "mat", chapters: 28 },
                { name: "마가복음", code: "mrk", chapters: 16 },
                { name: "누가복음", code: "luk", chapters: 24 },
                { name: "요한복음", code: "jhn", chapters: 21 },
                { name: "사도행전", code: "act", chapters: 28 }
            ]
        };

        async function loadBookData(bookCode) {
            try {
                const response = await fetch(`${bookCode}.json`);
                currentData = await response.json();
                renderBible();
            } catch (error) {
                document.getElementById('verses-list').innerHTML = `
                    <div class="text-center py-16 text-slate-400 space-y-3">
                        <p class="text-lg font-bold">🚧 주석 데이터 준비 중</p>
                        <p class="text-sm text-slate-500">현재 요한복음 3장 및 상황별 묵상이 준비되어 있습니다</p>
                    </div>`;
            }
        }

        async function loadTopicsData() {
            try {
                const response = await fetch('topics.json');
                topicsData = await response.json();
                renderTopicsTags();
            } catch (error) {
                console.error("Topics load failed", error);
            }
        }

        function switchMainTab(tab) {
            const isBible = tab === 'bible';
            document.getElementById('view-bible').classList.toggle('hidden', !isBible);
            document.getElementById('view-topics').classList.toggle('hidden', isBible);
            document.getElementById('level-bar').classList.toggle('hidden', !isBible);

            document.getElementById('nav-tab-bible').className = isBible ? "bg-blue-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow" : "bg-slate-800 text-slate-400 px-3.5 py-1.5 rounded-xl text-xs font-bold transition";
            document.getElementById('nav-tab-topics').className = !isBible ? "bg-blue-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition shadow" : "bg-slate-800 text-slate-400 px-3.5 py-1.5 rounded-xl text-xs font-bold transition";
            if (isBible) closePanel();
        }

        function renderBible() {
            if (!currentData) return;
            document.getElementById('current-location-btn').innerText = `${currentData.book} ${currentData.chapter}장`;
            let listContainer = document.getElementById('verses-list');
            listContainer.innerHTML = "";
            currentData.verses.forEach((item, index) => {
                listContainer.innerHTML += `
                    <div onclick="selectVerse(${index})" class="p-3.5 rounded-2xl transition cursor-pointer hover:bg-slate-800/80 border border-transparent hover:border-slate-700 flex items-start space-x-3 active:scale-[0.99]">
                        <span class="bg-blue-600/20 text-blue-400 font-bold px-2.5 py-1 rounded-xl text-sm mt-0.5 shrink-0">${item.verse}절</span>
                        <p class="text-slate-100 flex-1">${item.text}</p>
                    </div>`;
            });
        }

        function renderTopicsTags() {
            const container = document.getElementById('topic-tags-container');
            container.innerHTML = "";
            Object.keys(topicsData).forEach(topicName => {
                container.innerHTML += `
                    <button onclick="selectTopic('${topicName}')" class="bg-slate-900 hover:bg-blue-600/20 text-slate-300 hover:text-blue-400 border border-slate-800 hover:border-blue-500/30 px-3 py-2 rounded-xl text-xs font-semibold transition active:scale-95 shadow-sm">
                        # ${topicName}
                    </button>`;
            });
        }

        function selectTopic(topicName) {
            const data = topicsData[topicName];
            if (!data) return;
            let commentaryText = currentLevel === 1 ? data.commentary.level1 : currentLevel === 2 ? data.commentary.level2 : data.commentary.level3;
            let applicationText = currentLevel === 1 ? data.application.level1 : currentLevel === 2 ? data.application.level2 : data.application.level3;
            let levelName = currentLevel === 1 ? '초신자용 주석' : currentLevel === 2 ? '일반 성도용 주석' : '리더·교사용 주해';

            document.getElementById('topic-result-title').innerText = `📌 #${topicName} (${data.reference})`;
            document.getElementById('topic-result-verse').innerText = `"${data.text}"`;
            document.getElementById('topic-result-level-label').innerText = `💡 ${levelName}`;
            document.getElementById('topic-result-commentary').innerText = commentaryText;
            document.getElementById('topic-result-application').innerText = applicationText;

            document.getElementById('topic-result-card').classList.remove('hidden');
            document.getElementById('topic-result-card').scrollIntoView({ behavior: 'smooth' });
        }

        function closeTopicResult() {
            document.getElementById('topic-result-card').classList.add('hidden');
        }

        function selectVerse(index) {
            activeVerseIndex = index;
            const item = currentData.verses[index];
            let commentaryText = currentLevel === 1 ? item.commentary.level1 : currentLevel === 2 ? item.commentary.level2 : item.commentary.level3;
            let applicationText = currentLevel === 1 ? item.application.level1 : currentLevel === 2 ? item.application.level2 : item.application.level3;
            let levelName = currentLevel === 1 ? '초신자용 주석' : currentLevel === 2 ? '일반 성도용 주석' : '리더·교사용 주해';

            document.getElementById('panel-title').innerText = `${currentData.book} ${currentData.chapter}장 ${item.verse}절`;
            document.getElementById('panel-verse-text').innerText = `"${item.text}"`;
            document.getElementById('panel-level-label').innerText = `💡 ${levelName}`;
            document.getElementById('panel-commentary-text').innerText = commentaryText;
            document.getElementById('panel-application-text').innerText = applicationText;

            document.getElementById('commentary-panel').classList.remove('translate-y-full');
        }

        function closePanel() {
            document.getElementById('commentary-panel').classList.add('translate-y-full');
            activeVerseIndex = null;
        }

        function changeLevel(level) {
            currentLevel = level;
            for (let i = 1; i <= 3; i++) {
                document.getElementById(`btn-${i}`).className = (i === level)
                    ? "py-1.5 text-xs font-bold rounded-xl bg-blue-600 text-white transition shadow"
                    : "py-1.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition";
            }
            if (activeVerseIndex !== null) selectVerse(activeVerseIndex);
        }

        function openBookModal() { document.getElementById('book-modal').classList.remove('hidden'); renderBookGrid(); }
        function closeBookModal() { document.getElementById('book-modal').classList.add('hidden'); }

        function switchTestament(testament) {
            currentTestament = testament;
            document.getElementById('tab-ot').className = testament === 'ot' ? "flex-1 pb-3 text-sm font-bold text-blue-400 border-b-2 border-blue-500 transition" : "flex-1 pb-3 text-sm font-bold text-slate-400 border-b-2 border-transparent transition";
            document.getElementById('tab-nt').className = testament === 'nt' ? "flex-1 pb-3 text-sm font-bold text-blue-400 border-b-2 border-blue-500 transition" : "flex-1 pb-3 text-sm font-bold text-slate-400 border-b-2 border-transparent transition";
            renderBookGrid();
        }

        function renderBookGrid() {
            const container = document.getElementById('book-grid-container');
            const books = bibleDataMap[currentTestament];
            let html = '<div class="grid grid-cols-1 gap-3 max-w-md mx-auto">';
            books.forEach(b => {
                html += `<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-sm">
                    <div class="flex justify-between items-center"><span class="font-bold text-base text-white">${b.name}</span><span class="text-xs text-slate-400 bg-slate-800 px-2.5 py-1 rounded-lg">총 ${b.chapters}장</span></div>
                    <div class="flex flex-wrap gap-1.5">`;
                for (let c = 1; c <= Math.min(b.chapters, 5); c++) {
                    let isSample = (b.code === 'jhn' && c === 3);
                    let activeClass = isSample ? 'bg-blue-600 text-white font-bold shadow' : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700';
                    html += `<button onclick="selectBookAndChapter('${b.code}', ${c}, ${isSample})" class="w-10 h-10 rounded-xl text-xs font-semibold ${activeClass} transition flex items-center justify-center">${c}</button>`;
                }
                if (b.chapters > 5) html += `<span class="text-xs text-slate-500 self-center px-2">외 ${b.chapters - 5}개 장 준비 중</span>`;
                html += `</div></div>`;
            });
            container.innerHTML = html + '</div>';
        }

        function selectBookAndChapter(code, chapter, isReady) {
            closeBookModal();
            closePanel();
            if (isReady) {
                loadBookData(code);
            } else {
                document.getElementById('verses-list').innerHTML = `<div class="text-center py-16 text-slate-400 space-y-3"><p class="text-base font-bold">🚧 ${code.toUpperCase()} ${chapter}장 데이터 준비 중</p><p class="text-sm text-slate-500">요한복음 3장 샘플을 이용해 주세요!</p></div>`;
                document.getElementById('current-location-btn').innerText = `${code} ${chapter}장`;
            }
        }

        loadBookData('jhn');
        loadTopicsData();
    </script>
</body>

</html>
